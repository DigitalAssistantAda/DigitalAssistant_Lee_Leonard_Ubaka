services:
  # Optional: only needed if not using Supabase. Start with: docker compose --profile local-db up
  db:
    image: postgres:15
    container_name: digitalassistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digitalassistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - local-db

  redis:
    image: redis:7-alpine
    container_name: digitalassistant-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digitalassistant-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - EMBEDDING_SERVICE=${EMBEDDING_SERVICE:-local}
      - EMBEDDING_FINETUNE_OUTPUT_DIR=/app/data/embedding_model
    volumes:
      - ./backend:/app
      - embedding_model_data:/app/data/embedding_model
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digitalassistant-celery-worker
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - embedding_model_data:/app/data/embedding_model
    networks:
      - app-network
    environment:
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - EMBEDDING_SERVICE=${EMBEDDING_SERVICE:-local}
      - EMBEDDING_FINETUNE_OUTPUT_DIR=/app/data/embedding_model
      - EMBEDDING_REFRESH_ENABLED=${EMBEDDING_REFRESH_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=20

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digitalassistant-celery-beat
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - embedding_model_data:/app/data/embedding_model
    networks:
      - app-network
    environment:
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - EMBEDDING_SERVICE=${EMBEDDING_SERVICE:-local}
      - EMBEDDING_FINETUNE_OUTPUT_DIR=/app/data/embedding_model
      - EMBEDDING_REFRESH_ENABLED=${EMBEDDING_REFRESH_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app beat --loglevel=info
    profiles:
      - schedule

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digitalassistant-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network
    stdin_open: true
    tty: true

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  embedding_model_data:
