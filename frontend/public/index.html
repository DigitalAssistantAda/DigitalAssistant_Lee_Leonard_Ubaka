<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3f1" />
    <meta name="description" content="Ada — A secure digital assistant for organizing, searching, and summarizing your internal documents." />
    <meta property="og:title" content="Ada — Digital Assistant" />
    <meta property="og:description" content="Upload, organize, search, and summarize your internal documents securely." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&family=La+Belle+Aurore&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Sen:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <title>Ada — Digital Assistant</title>
    <script>
      // Apply theme + cached accent tokens before first paint to prevent color flash.
      (function () {
        try {
          var root = document.documentElement;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (localStorage.getItem('darkMode') === 'true') {
            root.classList.add('dark');
            if (themeMeta) themeMeta.setAttribute('content', '#1b1b1e');
          }

          var rawAccentCache = localStorage.getItem('ada:accent-vars:v1');
          if (rawAccentCache) {
            var accentCache = JSON.parse(rawAccentCache);
            if (accentCache && typeof accentCache === 'object') {
              Object.keys(accentCache).forEach(function (key) {
                var value = accentCache[key];
                if (typeof value === 'string' && value) {
                  root.style.setProperty(key, value);
                }
              });
              return;
            }
          }

          // Fallbacks for sessions created before token cache existed.
          var rawAccent = localStorage.getItem('ada:accent-color')
            || localStorage.getItem('accent_color');
          if (!rawAccent) {
            var rawUser = localStorage.getItem('user');
            if (rawUser) {
              try {
                var parsedUser = JSON.parse(rawUser);
                if (parsedUser && typeof parsedUser.accent_color === 'string') {
                  rawAccent = parsedUser.accent_color;
                }
              } catch (_) {}
            }
          }

          if (typeof rawAccent === 'string') {
            rawAccent = rawAccent.trim();
          }
          if (typeof rawAccent === 'string' && /^#?[0-9A-Fa-f]{6}$/.test(rawAccent)) {
            var hex = rawAccent.charAt(0) === '#' ? rawAccent.toUpperCase() : ('#' + rawAccent.toUpperCase());
            root.style.setProperty('--accent-primary-custom', hex);
            root.style.setProperty('--accent-hover-custom', hex);
            root.style.setProperty('--accent-secondary-custom', hex);
            root.style.setProperty('--accent-highlight-custom', hex);
            root.style.setProperty('--accent-primary-custom-dark', hex);
            root.style.setProperty('--accent-hover-custom-dark', hex);
            root.style.setProperty('--accent-secondary-custom-dark', hex);
            root.style.setProperty('--accent-highlight-custom-dark', hex);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Hey. You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
